[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-diagnostics-tool"
version = "0.1.0"
description = "A command-line tool for checking developer environment health"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cli-diagnostics = "diagnostics_tool.cli:main"

[tool.setuptools.packages.find]
include = ["diagnostics_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]